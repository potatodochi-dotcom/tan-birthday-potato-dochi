    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(350, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'turn') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(440, audioCtx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'win') {
                const now = audioCtx.currentTime;
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const noteOsc = audioCtx.createOscillator();
                    const noteGain = audioCtx.createGain();
                    noteOsc.connect(noteGain);
                    noteGain.connect(audioCtx.destination);
                    noteOsc.type = 'sine';
                    noteOsc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    noteGain.gain.setValueAtTime(0.12, now + idx * 0.08);
                    noteGain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.25);
                    noteOsc.start(now + idx * 0.08);
                    noteOsc.stop(now + idx * 0.08 + 0.25);
                });
            }
        }
    </script>

            { id: 'char_14', grade: 'R', name: '전희완', msg: '희완 캐릭터 SD!', weight: 5.19, badgeColor: 'bg-amber-600', svg: getAvatarSvg('희완', '#EFEBE9') },
            { id: 'char_15', grade: 'R', name: '병길용', msg: '길용 캐릭터 SD!', weight: 5.19, badgeColor: 'bg-amber-600', svg: getAvatarSvg('길용', '#FAFAFA') },
            { id: 'char_16', grade: 'R', name: '정덕협', msg: '덕협 캐릭터 SD!', weight: 5.19, badgeColor: 'bg-amber-600', svg: getAvatarSvg('덕협', '#F5F5F5') },
            { id: 'char_17', grade: 'R', name: '김재후', msg: '재후 캐릭터 SD!', weight: 5.19, badgeColor: 'bg-amber-600', svg: getAvatarSvg('재후', '#ECEFF1') },
            { id: 'char_18', grade: 'R', name: '김예후', msg: '예후 캐릭터 SD!', weight: 5.19, badgeColor: 'bg-amber-600', svg: getAvatarSvg('예후', '#EFEBE9') },
            { id: 'char_19', grade: 'R', name: '함세형', msg: '세형 캐릭터 SD!', weight: 5.19, badgeColor: 'bg-amber-600', svg: getAvatarSvg('세형', '#F7F2EB') }
        ];

        function getAvatarSvg(initial, bgColor) {
            return `<svg viewBox="0 0 100 100" class="w-full h-full drop-shadow"><circle cx="50" cy="50" r="42" fill="${bgColor}"/><circle cx="50" cy="45" r="20" fill="#FFF0ED"/><circle cx="43" cy="43" r="2.5" fill="#333"/><circle cx="57" cy="43" r="2.5" fill="#333"/><text x="50" y="85" font-size="14" font-weight="bold" text-anchor="middle" fill="#555">${initial}</text></svg>`;
        }

        let state = {
            tickets: 1,
            comments: [],
            inventory: {}
        };

        window.initApp = function() {
            const saved = localStorage.getItem('tan_bday_scrapbook_v9');
            if (saved) { try { state = JSON.parse(saved); } catch (e) {} }
            renderUI();

            const q = query(collection(db, "comments"), orderBy("createdAt", "asc"));
            onSnapshot(q, (snapshot) => {
                state.comments = [];
                snapshot.forEach((doc) => {
                    state.comments.push(doc.data());
                });
                renderComments();
            }, (error) => {
                console.error("Firestore 연결 오류:", error);
            });
        }

        window.saveApp = function() {
            localStorage.setItem('tan_bday_scrapbook_v9', JSON.stringify(state));
            renderUI();
        }

        window.renderUI = function() {
            document.getElementById('ticketCount').innerText = `${state.tickets}개`;
            const drawBtn = document.getElementById('drawBtn');
            drawBtn.disabled = state.tickets <= 0;
            if (state.tickets <= 0) drawBtn.classList.add('opacity-50', 'cursor-not-allowed');
            else drawBtn.classList.remove('opacity-50', 'cursor-not-allowed');

            renderChamberCapsules();
            renderGallery();
        }

        function renderChamberCapsules() {
            const chamber = document.getElementById('capsuleChamber');
            chamber.innerHTML = '';
            const colors = [{ t: '#C94A38', b: '#E8A598' }, { t: '#87CEEB', b: '#F4EFE6' }, { t: '#E8A598', b: '#87CEEB' }, { t: '#F4EFE6', b: '#C94A38' }];
            for (let i = 0; i < 9; i++) {
                const c = colors[i % colors.length];
                chamber.insertAdjacentHTML('beforeend', `<div class="w-6 h-6 rounded-full shadow-2xs border border-white flex flex-col overflow-hidden"><div class="w-full h-1/2" style="background-color: ${c.t};"></div><div class="w-full h-1/2" style="background-color: ${c.b};"></div></div>`);
            }
        }

        function renderComments() {
            const list = document.getElementById('messagesList');
            document.getElementById('msgCount').innerText = `총 ${state.comments.length}개`;
            list.innerHTML = '';
            state.comments.slice().reverse().forEach(c => {
                list.insertAdjacentHTML('beforeend', `<div class="bg-white/70 border border-[#D8C5B2] rounded-lg p-1.5 text-xs flex justify-between items-center"><div><span class="font-black text-themeRed mr-1 text-[11px]">@${escapeHtml(c.nick)}</span><span class="text-stone-700 text-[11px]">${escapeHtml(c.msg)}</span></div><span class="text-[9px] text-stone-400 whitespace-nowrap">${c.time}</span></div>`);
            });
        }

        window.renderGallery = function() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';
            let countCollected = 0;

            REWARDS.forEach(r => {
                const cnt = state.inventory[r.id] || 0;
                if (cnt > 0) countCollected++;
                const isHave = cnt > 0;

                const item = `
                    <div class="bg-white border ${isHave ? 'border-themeRed/50' : 'border-[#D8C5B2]'} rounded-xl p-1.5 flex flex-col items-center justify-between shadow-2xs ${!isHave ? 'opacity-40 grayscale' : ''}">
                        <span class="text-[8px] font-black px-1.5 rounded-full text-white ${r.badgeColor}">
                            ${r.grade}
                        </span>
                        <div class="w-7 h-7 my-1 flex items-center justify-center">
                            ${isHave ? r.svg : `<div class="w-6 h-6 rounded-full bg-stone-200 flex items-center justify-center text-[9px] text-stone-500 font-bold">?</div>`}
                        </div>
                        <span class="text-[8px] font-bold text-stone-700 truncate w-full text-center">
                            ${isHave ? r.name : '알 수 없음'}
                        </span>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', item);
            });

            document.getElementById('collectionStat').innerText = `${countCollected} / ${REWARDS.length} 수집됨`;
        }

        window.handleCommentSubmit = async function(e) {
            e.preventDefault();
            playSfx('click');
            const nick = document.getElementById('nickInput').value.trim();
            const msg = document.getElementById('msgInput').value.trim();
            if (!nick || !msg) return;

            try {
                await addDoc(collection(db, "comments"), {
                    nick: nick,
                    msg: msg,
                    time: '방금 전',
                    createdAt: Date.now()
                });
                state.tickets += 1;
                saveApp();
                document.getElementById('msgInput').value = '';
            } catch (err) {
                console.error("댓글 저장 실패:", err);
                alert("댓글 저장 중 오류가 발생했습니다.");
            }
        }

        let isDrawing = false;
        window.drawCapsule = function() {
            if (isDrawing || state.tickets <= 0) return;
            isDrawing = true;
            playSfx('turn');
            state.tickets -= 1;
            saveApp();

            const machine = document.getElementById('gachaMachine');
            const dial = document.getElementById('turnDial');
            machine.classList.add('shake-active');
            dial.classList.add('turn-dial');

            setTimeout(() => {
                machine.classList.remove('shake-active');
                dial.classList.remove('turn-dial');
                isDrawing = false;
                
                const reward = pickReward();
                state.inventory[reward.id] = (state.inventory[reward.id] || 0) + 1;
                saveApp();
                
                openModalWithCapsuleAnimation(reward);
            }, 600);
        }

        function pickReward() {
            const total = REWARDS.reduce((acc, r) => acc + r.weight, 0);
            let rand = Math.random() * total;
            for (const r of REWARDS) {
                if (rand < r.weight) return r;
                rand -= r.weight;
            }
            return REWARDS[0];
        }

        window.openModalWithCapsuleAnimation = function(reward) {
            const modal = document.getElementById('rewardModal');
            const stepCapsule = document.getElementById('modalStepCapsule');
            const stepContent = document.getElementById('modalStepContent');
            const box = document.getElementById('modalBox');

            stepCapsule.classList.remove('hidden');
            stepContent.classList.add('hidden');
            modal.classList.remove('hidden');
            setTimeout(() => { box.classList.remove('scale-95', 'opacity-0'); box.classList.add('scale-100', 'opacity-100'); }, 10);

            playSfx('win');

            setTimeout(() => {
                stepCapsule.classList.add('hidden');
                stepContent.classList.remove('hidden');

                document.getElementById('modalGradeBadge').innerText = reward.grade;
                document.getElementById('modalGradeBadge').className = `px-3 py-0.5 rounded-full font-black text-xs text-white shadow-xs mb-2 ${reward.badgeColor}`;
                document.getElementById('modalAvatarSvg').innerHTML = reward.svg;
                document.getElementById('modalTitle').innerText = reward.name;
                document.getElementById('modalMsg').innerText = reward.msg;
            }, 1200);
        }

        window.closeModal = function() {
            const modal = document.getElementById('rewardModal');
            const box = document.getElementById('modalBox');
            box.classList.remove('scale-100', 'opacity-100');
            box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); }, 200);
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        window.onload = window.initApp;
    </script>
</body>
</html>
